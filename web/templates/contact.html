{{ define "content" }}
<div class="page-content">
    <h1>Contact Me</h1>

    <div class="contact-alternative">
        <p>Alternatively, you can contact me directly on <a href="https://discord.com/users/tofaa" target="_blank" class="discord-link">Discord</a> @tofaa</p>
    </div>

    <form class="contact-form" action="/contact" method="POST">
        <div class="form-group">
            <label for="name">Name</label>
            <textarea type="text" id="name" name="name" required></textarea>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <textarea type="email" id="email" name="email" required></textarea>
        </div>

        <div class="form-group">
            <label for="subject">Subject</label>
            <textarea id="subject" name="subject" required></textarea>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
    </form>
</div>
{{ end }}
